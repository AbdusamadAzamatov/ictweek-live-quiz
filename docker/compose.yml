# ICTWEEK quiz — production stack: postgres + app + caddy (TLS).
#   docker compose -f docker/compose.yml --env-file docker/.env up -d --build
name: ictquiz

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ictquiz
    # No published ports — only reachable on the internal network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ictquiz']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ictquiz-app:${APP_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # env_file values are literal — compose interpolates ${...} only here.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/ictquiz
    volumes:
      - media:/data/media
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Sizing suggestion for the 8 GB event host (see docs/runbooks/deploy.md).
    deploy:
      resources:
        limits:
          memory: 2G

  caddy:
    image: caddy:2-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    depends_on:
      app:
        condition: service_started
    env_file: .env # provides DOMAIN for the Caddyfile
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
